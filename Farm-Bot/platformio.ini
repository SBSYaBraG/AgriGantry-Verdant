; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = megaatmega2560-encoder-test

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
monitor_filters = direct
build_src_filter =
  -<*>
  +<main.cpp>

[env:megaatmega2560-encoder-test]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
monitor_filters =
  direct
  time
  log2file
build_src_filter =
  -<*>
  +<encoder_test_main.cpp>

; Dedicated safety-first firmware for manually calibrating the currently
; connected ICL drivers.  It intentionally does not build main.cpp or the
; encoder test, so it cannot auto-home on upload.
[env:megaatmega2560-manual-calibration]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
monitor_filters = direct
build_src_filter =
  -<*>
  +<manual_calibration_main.cpp>
